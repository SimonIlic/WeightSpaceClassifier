[project]
name = "cnn_surgery"
version = "0.1.0"
description = "Code for 'project snijzaal'"
authors = [
    {name = "Simon Ilić", email = "ilic@cwi.nl"},
    {name = "Moos Middelkoop", email = "moos@cwi.nl"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=6.30.1",
    "ipython>=9.4.0",
    "matplotlib>=3.10.5",
    "matplotlib-inline>=0.1.7",
    "numpy>=2.3.2",
    "pandas>=2.3.1",
    "tensorflow>=2.20.0",
    "torch>=2.8.0",
]

[tool.ruff.lint]
unfixable = ["F401"] # never auto-remove imports
